[theme]
base = "light"
primaryColor = "#0891B2"
backgroundColor = "#F6F9FC"
secondaryBackgroundColor = "#EEF4F8"
textColor = "#17364B"
font = "sans serif"

[server]
address = "0.0.0.0"
port = 8501
headless = true
maxUploadSize = 50
enableXsrfProtection = true
enableCORS = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
