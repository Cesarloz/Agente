[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agente-platform"
version = "0.1.0"
description = "Administración de agentes con FastAPI, LangGraph y Streamlit"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "langchain>=1,<2", "langgraph>=1,<2", "langchain-core>=1,<2",
  "langchain-text-splitters>=1,<2",
  "langchain-openai>=1,<2", "langchain-google-genai>=4,<5",
  "langchain-chroma>=1,<2", "chromadb>=1,<2",
  "sqlalchemy>=2.0,<3", "alembic>=1.15,<2", "psycopg[binary,pool]>=3.2,<4",
  "streamlit>=1.45,<2", "pydantic>=2.10,<3", "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "httpx>=0.28,<1", "cryptography>=44,<50",
  "sqlglot>=27,<31", "pymysql>=1.1,<2", "pymssql>=2.3,<3",
  "beautifulsoup4>=4.13,<5", "tenacity>=9,<10", "pillow>=12.3,<13"
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.10,<2"]
test = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
