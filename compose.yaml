name: agente

x-backend: &backend
  build: .
  image: agente-platform:local
  environment: &backend-environment
    DATABASE_URL: postgresql+psycopg://agente:${POSTGRES_PASSWORD:-agente_local}@postgres:5432/agente
    ADMIN_TOKEN_FILE: /run/agente/admin_token
    ENCRYPTION_KEY_FILE: /run/agente/encryption_key
    SUPERUSER_PASSWORD_HASH_FILE: /run/agente/superuser_password_hash
    AUTH_SESSION_SECONDS: ${AUTH_SESSION_SECONDS:-28800}
    FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    STORAGE_DIR: /app/storage
    CHROMA_HOST: chroma
    CHROMA_PORT: 8000
    VECTOR_PROVIDER: ${VECTOR_PROVIDER:-chroma}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    URL_ALLOWED_HOSTS: ${URL_ALLOWED_HOSTS:-}
    GRAPH_API_VERSION: ${GRAPH_API_VERSION:-v23.0}
    ANONYMIZED_TELEMETRY: "False"
  volumes:
    - storage:/app/storage
    - secrets:/run/agente:ro
  restart: unless-stopped

services:
  init:
    build: .
    image: agente-platform:local
    user: root
    command: ["python", "scripts/init_secrets.py"]
    volumes:
      - secrets:/run/agente
      - storage:/app/storage
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agente
      POSTGRES_USER: agente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agente_local}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agente -d agente"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.5.9
    volumes:
      - chroma:/data
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "False"
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      chroma: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "scripts/check_api.py"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}

  admin:
    <<: *backend
    command: ["streamlit", "run", "admin/app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_BASE_URL: http://api:8000
    volumes: []
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8501}:8501"
    depends_on:
      api: {condition: service_healthy}

volumes:
  postgres:
  chroma:
  storage:
  secrets:
